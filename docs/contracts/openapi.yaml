    get:
      tags: [workflows]
      operationId: listWorkflowExecutions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - name: triggerType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
