    get:
      tags: [notifications]
      operationId: notificationsWebSocket
      security: []
      description: >-
        WebSocket handshake. Send exactly two subprotocol values: the fixed
        `coinsphere.notifications.v1` value followed by the bearer access token.
        Query-string tokens are rejected.
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            example: coinsphere.notifications.v1, eyJ...
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the same route and filter set.
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FinancialResourceId' }
    StrategyVersionId:
      name: strategyVersionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FinancialResourceId' }
    BacktestId:
      name: backtestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/FinancialResourceId' }
    WorkflowSecret:
      name: X-Workflow-Secret
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    NewsId: { name: newsId, in: path, required: true, schema: { type: integer, format: int64 } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    MenuId: { name: menuId, in: path, required: true, schema: { type: integer, format: int64 } }
    ButtonId: { name: buttonId, in: path, required: true, schema: { type: integer, format: int64 } }
    DefinitionId: { name: definitionId, in: path, required: true, schema: { type: integer, format: int64 } }
    ExecutionId: { name: executionId, in: path, required: true, schema: { type: integer, format: int64 } }
    ConfigId: { name: configId, in: path, required: true, schema: { type: integer, format: int64 } }
    AgentId: { name: agentId, in: path, required: true, schema: { type: integer, format: int64 } }
    ChannelId: { name: channelId, in: path, required: true, schema: { type: integer, format: int64 } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
    DeliveryId: { name: deliveryId, in: path, required: true, schema: { type: integer, format: int64 } }
    TaskCode: { name: taskCode, in: path, required: true, schema: { type: string } }
    EntryKey: { name: entryKey, in: path, required: true, schema: { type: string } }
    WorkflowCode: { name: workflowCode, in: path, required: true, schema: { type: string } }
    AgentCode: { name: agentCode, in: path, required: true, schema: { type: string } }
  requestBodies:
    JsonObject:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
  responses:
    Success:
      description: Successful data envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    CursorPage:
      description: Successful opaque-cursor page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CursorPageResponse'
    InAppCursorPage:
      description: Successful user-scoped in-app notification page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InAppCursorPageResponse'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired, revoked, or invalid authentication
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated principal lacks permission or ownership
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency or state conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Command backlog limit exceeded
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    SuccessResponse:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, format: int32, example: 200 }
        msg: { type: string, example: success }
        data: {}
    CursorPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/JsonObject' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    CursorPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CursorPageData' }
    InAppCursorPageData:
      allOf:
        - $ref: '#/components/schemas/CursorPageData'
        - type: object
          required: [unreadCount]
          properties:
            unreadCount: { type: integer, format: int64, minimum: 0 }
    InAppCursorPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InAppCursorPageData' }
    Problem:
      type: object
      required: [type, title, status, detail, requestId]
      properties:
        type: { type: string, format: uri-reference, example: about:blank }
        title: { type: string, example: Unauthorized }
        status: { type: integer, format: int32, example: 401 }
        detail: { type: string }
        requestId: { type: string }
    FinancialResourceId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    DecimalString:
      type: string
      pattern: '^[0-9]+(?:\.[0-9]+)?$'
    SignedDecimalString:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
    Venue:
      type: string
      enum: [binance]
    Market:
      type: string
      enum: [spot, usd_m]
    InstrumentStatus:
      type: string
      enum: [trading, suspended]
    CandleInterval:
      type: string
      enum: [1m, 5m, 15m, 1h, 4h, 1d]
    MarketSymbol:
      type: object
      required:
        [id, venue, market, nativeSymbol, baseAsset, quoteAsset, status,
         priceTick, quantityStep, minQuantity, minNotional, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/FinancialResourceId' }
        venue: { $ref: '#/components/schemas/Venue' }
        market: { $ref: '#/components/schemas/Market' }
        nativeSymbol: { type: string, maxLength: 64 }
        baseAsset: { type: string, maxLength: 32 }
        quoteAsset: { type: string, maxLength: 32 }
        status: { $ref: '#/components/schemas/InstrumentStatus' }
        priceTick: { $ref: '#/components/schemas/DecimalString' }
        quantityStep: { $ref: '#/components/schemas/DecimalString' }
        minQuantity: { $ref: '#/components/schemas/DecimalString' }
        minNotional: { $ref: '#/components/schemas/DecimalString' }
        updatedAt: { type: string, format: date-time }
    MarketSymbolPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/MarketSymbol' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    MarketSymbolPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MarketSymbolPageData' }
    MarketCandle:
      type: object
      required:
        [instrumentId, interval, openTime, closeTime, open, high, low, close,
         baseVolume, isClosed]
      properties:
        instrumentId: { $ref: '#/components/schemas/FinancialResourceId' }
        interval: { $ref: '#/components/schemas/CandleInterval' }
        openTime: { type: string, format: date-time }
        closeTime: { type: string, format: date-time }
        open: { $ref: '#/components/schemas/DecimalString' }
        high: { $ref: '#/components/schemas/DecimalString' }
        low: { $ref: '#/components/schemas/DecimalString' }
        close: { $ref: '#/components/schemas/DecimalString' }
        baseVolume: { $ref: '#/components/schemas/DecimalString' }
        isClosed: { type: boolean }
    MarketCandlePageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/MarketCandle' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    MarketCandlePageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MarketCandlePageData' }
    WatchlistCreateRequest:
      type: object
      required: [instrumentId, interval]
      properties:
        instrumentId: { $ref: '#/components/schemas/FinancialResourceId' }
        interval: { $ref: '#/components/schemas/CandleInterval' }
    WatchlistItem:
      type: object
      required: [id, ownerUserId, instrumentId, interval, createdAt]
      properties:
        id: { $ref: '#/components/schemas/FinancialResourceId' }
        ownerUserId: { type: integer, format: int64, minimum: 1 }
        instrumentId: { $ref: '#/components/schemas/FinancialResourceId' }
        interval: { $ref: '#/components/schemas/CandleInterval' }
        createdAt: { type: string, format: date-time }
    WatchlistPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/WatchlistItem' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    WatchlistPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/WatchlistPageData' }
    WatchlistItemResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/WatchlistItem' }
    StrategyParameterValue:
      description: Integer, Decimal string, boolean, or bounded string validated by parameterSchema.
    StrategyParameterSpec:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [integer, decimal, boolean, string]
        required: { type: boolean, default: true }
        default: { $ref: '#/components/schemas/StrategyParameterValue' }
        minimum: { $ref: '#/components/schemas/SignedDecimalString' }
        maximum: { $ref: '#/components/schemas/SignedDecimalString' }
        enum:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StrategyParameterValue' }
    StrategyParameterSchema:
      type: object
      maxProperties: 64
      additionalProperties: { $ref: '#/components/schemas/StrategyParameterSpec' }
    StrategyDraftRequest:
      type: object
      additionalProperties: false
      required: [name, sourceCode, market, instrumentId, interval, lookbackBars, parameterSchema]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sourceCode: { type: string, minLength: 1, maxLength: 65536 }
        market: { $ref: '#/components/schemas/Market' }
        instrumentId: { $ref: '#/components/schemas/FinancialResourceId' }
        interval: { $ref: '#/components/schemas/CandleInterval' }
        lookbackBars: { type: integer, minimum: 1, maximum: 10000 }
        parameterSchema: { $ref: '#/components/schemas/StrategyParameterSchema' }
    StrategyDraft:
      allOf:
        - $ref: '#/components/schemas/StrategyDraftRequest'
        - type: object
          required: [id, runtimeVersion, createdAt, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/FinancialResourceId' }
            runtimeVersion: { type: string, enum: [python3.12] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StrategyDraftPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StrategyDraft' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    StrategyDraftPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StrategyDraftPageData' }
    StrategyDraftResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StrategyDraft' }
    StrategyVersion:
      type: object
      required:
        [id, strategyId, versionNumber, status, name, sourceCode, codeSha256,
         runtimeVersion, market, instrumentId, symbol, interval, lookbackBars,
         parameterSchema, createdAt]
      properties:
        id: { $ref: '#/components/schemas/FinancialResourceId' }
        strategyId: { $ref: '#/components/schemas/FinancialResourceId' }
        versionNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, published, failed] }
        name: { type: string, minLength: 1, maxLength: 120 }
        sourceCode: { type: string, minLength: 1, maxLength: 65536 }
        codeSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        runtimeVersion: { type: string, enum: [python3.12] }
        market: { $ref: '#/components/schemas/Market' }
        instrumentId: { $ref: '#/components/schemas/FinancialResourceId' }
        symbol: { type: string, minLength: 1, maxLength: 64 }
        interval: { $ref: '#/components/schemas/CandleInterval' }
        lookbackBars: { type: integer, minimum: 1, maximum: 10000 }
        parameterSchema: { $ref: '#/components/schemas/StrategyParameterSchema' }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    StrategyVersionPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StrategyVersion' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    StrategyVersionPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StrategyVersionPageData' }
    StrategyVersionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StrategyVersion' }
    BacktestCreateRequest:
      type: object
      additionalProperties: false
      required:
        [strategyVersionId, parameters, startTime, endTime, allocationUsdt,
         initialEquity, feeRate, slippageRate]
      properties:
        strategyVersionId: { $ref: '#/components/schemas/FinancialResourceId' }
        parameters:
          type: object
          maxProperties: 64
          additionalProperties: { $ref: '#/components/schemas/StrategyParameterValue' }
        startTime:
          type: string
          format: date-time
          description: Inclusive UTC candle open time; must end in Z.
        endTime:
          type: string
          format: date-time
          description: Exclusive UTC candle close boundary; must end in Z.
        allocationUsdt: { $ref: '#/components/schemas/DecimalString' }
        initialEquity: { $ref: '#/components/schemas/DecimalString' }
        feeRate: { $ref: '#/components/schemas/DecimalString' }
        slippageRate: { $ref: '#/components/schemas/DecimalString' }
        fundingRates:
          type: array
          description: Required for USD-M with exactly one frozen rate per candle; omitted for Spot.
          items: { $ref: '#/components/schemas/SignedDecimalString' }
        stopLossRatio: { $ref: '#/components/schemas/DecimalString' }
        maintenanceMarginRatio: { $ref: '#/components/schemas/DecimalString' }
    BacktestSummary:
      type: object
      required: [initialEquity, finalEquity, returnUsdt, returnRatio, maxDrawdown, type]
      properties:
        initialEquity: { $ref: '#/components/schemas/SignedDecimalString' }
        finalEquity: { $ref: '#/components/schemas/SignedDecimalString' }
        returnUsdt: { $ref: '#/components/schemas/SignedDecimalString' }
        returnRatio: { $ref: '#/components/schemas/SignedDecimalString' }
        maxDrawdown: { $ref: '#/components/schemas/SignedDecimalString' }
        type: { type: string, enum: [summary] }
    Backtest:
      allOf:
        - $ref: '#/components/schemas/BacktestCreateRequest'
        - type: object
          required: [id, ownerUserId, simulatorVersion, status, createdAt]
          properties:
            id: { $ref: '#/components/schemas/FinancialResourceId' }
            ownerUserId: { type: integer, format: int64, minimum: 1 }
            simulatorVersion: { type: string, enum: [decimal-bar-v1] }
            status:
              type: string
              enum: [queued, claimed, running, cancelRequested, succeeded, failed, canceled]
            failureCategory: { type: string, maxLength: 64, nullable: true }
            summary: { $ref: '#/components/schemas/BacktestSummary' }
            inputSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            resultSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            manifestSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            createdAt: { type: string, format: date-time }
    BacktestPageData:
      type: object
      required: [records, nextCursor, hasMore, total]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Backtest' }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        total: { type: integer, format: int64, minimum: 0 }
    BacktestPageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BacktestPageData' }
    BacktestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Backtest' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, format: password, minLength: 1, maxLength: 256 }
    LoginData:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/LoginData' }
    ReauthRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 1, maxLength: 256 }
    ReauthData:
      type: object
      required: [reauthToken]
      properties:
        reauthToken: { type: string, minLength: 43 }
    ReauthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReauthData' }
    UserInfo:
      type: object
      required: [userId, username, roleCodes, permissions, accessMode]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        avatar: { type: string }
        roleCodes:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        accessMode: { type: string, enum: [authenticated] }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserInfo' }
