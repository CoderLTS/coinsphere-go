        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/{definitionId}/runtime/entries/{entryKey}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/DefinitionId'
      - $ref: '#/components/parameters/EntryKey'
    post:
      tags: [workflows]
      operationId: rotateWorkflowSecret
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/{definitionId}/executions:
