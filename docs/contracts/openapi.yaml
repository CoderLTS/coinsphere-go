openapi: 3.0.3
info:
  title: CoinSphere API
  version: 1.0.0
  description: >-
    The versioned HTTP and WebSocket contract for the CoinSphere modular
    monolith. This document is the source for the generated Go and TypeScript
    contract types.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: auth
  - name: me
  - name: admin
  - name: workflows
  - name: notifications
  - name: assistant
  - name: config
  - name: data
  - name: markets
  - name: strategies
  - name: backtests
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/reauth:
    post:
      tags: [auth]
      operationId: reauthenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: One-time token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me:
    get:
      tags: [me]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/home/meta:
    get:
      tags: [me]
      operationId: getHomeMeta
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/home/overview:
    get:
      tags: [me]
      operationId: getHomeOverview
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/markets/symbols:
    get:
      tags: [markets]
      operationId: listMarketSymbols
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: market
          in: query
          schema: { $ref: '#/components/schemas/Market' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Binance Spot and USD-M instrument metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSymbolPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/markets/candles:
    get:
      tags: [markets]
      operationId: listMarketCandles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: instrumentId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FinancialResourceId' }
        - name: interval
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CandleInterval' }
        - name: startTime
          in: query
          schema: { type: string, format: date-time }
        - name: endTime
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Persisted normalized Binance candles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCandlePageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/watchlists:
    get:
      tags: [markets]
      operationId: listWatchlistItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's watchlist items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [markets]
      operationId: createWatchlistItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchlistCreateRequest' }
      responses:
        '200':
          description: Watchlist item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/watchlists/{watchlistId}:
    parameters:
      - name: watchlistId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/FinancialResourceId' }
    delete:
      tags: [markets]
      operationId: deleteWatchlistItem
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/strategies:
    get:
      tags: [strategies]
      operationId: listStrategyDrafts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Administrator strategy drafts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraftPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [strategies]
      operationId: createStrategyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyDraftRequest' }
      responses:
        '200':
          description: Strategy draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/strategies/{strategyId}:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    get:
      tags: [strategies]
      operationId: getStrategyDraft
      responses:
        '200':
          description: Strategy draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraftResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [strategies]
      operationId: updateStrategyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyDraftRequest' }
      responses:
        '200':
          description: Strategy draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/strategies/{strategyId}/publish:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    post:
      tags: [strategies]
      operationId: publishStrategy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Immutable strategy version queued for validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/strategies:
    get:
      tags: [strategies]
      operationId: listPublishedStrategies
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published immutable strategy versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersionPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/strategies/{strategyVersionId}:
    parameters:
      - $ref: '#/components/parameters/StrategyVersionId'
    get:
      tags: [strategies]
      operationId: getPublishedStrategy
      responses:
        '200':
          description: Published immutable strategy version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/backtests:
    get:
      tags: [backtests]
      operationId: listBacktests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's backtests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [backtests]
      operationId: createBacktest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacktestCreateRequest' }
      responses:
        '200':
          description: Private backtest queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/backtests/{backtestId}:
    parameters:
      - $ref: '#/components/parameters/BacktestId'
    get:
      tags: [backtests]
      operationId: getBacktest
      responses:
        '200':
          description: Current user's backtest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/backtests/{backtestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BacktestId'
    post:
      tags: [backtests]
      operationId: cancelBacktest
      responses:
        '200':
          description: Backtest cancellation requested or completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/data/news:
    get:
      tags: [data]
      operationId: listNews
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200': { $ref: '#/components/responses/CursorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [data]
      operationId: createNews
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/data/news/{newsId}:
    parameters:
      - $ref: '#/components/parameters/NewsId'
    put:
      tags: [data]
      operationId: updateNews
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [data]
      operationId: deleteNews
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/notification-deliveries:
    get:
      tags: [notifications]
      operationId: listPushDeliveries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - name: workflowDefinitionId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: channelType
          in: query
          schema: { type: string }
        - name: deliveryStatus
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/CursorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: username
          in: query
          schema: { type: string }
        - name: gender
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/CursorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createUser
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [admin]
      operationId: updateUser
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteUser
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/uploads/avatars:
    post:
      tags: [admin]
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
              required: [avatar]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/system/roles:
    get:
      tags: [admin]
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: displayName
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: description
          in: query
          schema: { type: string }
        - name: isEnabled
          in: query
          schema: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/CursorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createRole
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    put:
      tags: [admin]
      operationId: updateRole
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteRole
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/roles/{roleId}/permissions:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    put:
      tags: [admin]
      operationId: saveRolePermissions
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/menus:
    get:
      tags: [admin]
      operationId: listMenus
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      operationId: createMenu
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/menus/manage-tree:
    get:
      tags: [admin]
      operationId: getManageMenuTree
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/i18n-dictionaries:
    get:
      tags: [admin]
      operationId: getI18nDictionaries
      parameters:
        - name: scope
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/system/menus/{menuId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    put:
      tags: [admin]
      operationId: updateMenu
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteMenu
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/menu-buttons:
    post:
      tags: [admin]
      operationId: createMenuButton
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/system/menu-buttons/{buttonId}:
    parameters:
      - $ref: '#/components/parameters/ButtonId'
    put:
      tags: [admin]
      operationId: updateMenuButton
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteMenuButton
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/overview:
    get:
      tags: [workflows]
      operationId: getWorkflowOverview
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/task-definitions:
    get:
      tags: [workflows]
      operationId: listTaskDefinitions
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/task-definitions/page:
    get:
      tags: [workflows]
      operationId: listTaskDefinitionPage
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200': { $ref: '#/components/responses/CursorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflows/task-definitions/{taskCode}/default-params:
    parameters:
      - $ref: '#/components/parameters/TaskCode'
    put:
      tags: [workflows]
      operationId: updateTaskDefinitionDefaults
