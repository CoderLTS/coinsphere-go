          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/system/menus/{menuId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    put:
      tags: [admin]
