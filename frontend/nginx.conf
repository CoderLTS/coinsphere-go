# 前端 nginx:托管 SPA + 反代到 Go 后端(compose 服务名 backend:6987)。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 外层代理终止 TLS 时保留其明确 scheme；直连或畸形值回落到当前 Nginx scheme。
map $http_x_forwarded_proto $effective_forwarded_proto {
    default      $scheme;
    ~*^http$     http;
    ~*^https$    https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;          # 头像/文件上传

    # 反代到 Go 后端时统一带上的头(含 WebSocket 升级)
    proxy_http_version 1.1;
    # $http_host 保留非默认端口，供后端与浏览器 Origin 做完整同源比较。
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # WebSocket 通知(/ws/notifications)
    location ^~ /ws/ {
        # token 通过 URL 查询串传入,关闭本路径访问日志,避免令牌落进 nginx 日志(见评审 #8)。
        access_log off;
        proxy_pass http://backend:6987;
        proxy_read_timeout 3600s;
    }

    # API 与后端托管的静态/上传资源
    location ^~ /api/     { proxy_pass http://backend:6987; }
    location ^~ /static/  { proxy_pass http://backend:6987; }
    location ^~ /uploads/ { proxy_pass http://backend:6987; }
    location = /health    { proxy_pass http://backend:6987; }

    # SPA:history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
