# 前端 nginx:托管 SPA + 反代到 Go 后端(compose 服务名 backend:6987)。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket 握手日志保留路径和状态，但不写入可能携带旧令牌的查询串。
log_format ws_no_args '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# 外层代理终止 TLS 时保留代理链首段 scheme；直连或畸形值回落到当前 Nginx scheme。
map $http_x_forwarded_proto $proxy_forwarded_proto {
    default             $scheme;
    ~*^\s*http(?:\s*,|$)  http;
    ~*^\s*https(?:\s*,|$) https;
}

# Tunnel 后的中间代理可能把 X-Forwarded-Proto 改成当前 HTTP 跳，Cloudflare 原始 scheme 优先。
map $http_cf_visitor $effective_forwarded_proto {
    default                $proxy_forwarded_proto;
    '{"scheme":"http"}'  http;
    '{"scheme":"https"}' https;
}

# Cloudflare Web Analytics 自动注入会破坏严格 CSP；禁止边缘改写 HTML。
map $sent_http_content_type $html_cache_control {
    default     "";
    ~^text/html "public, no-transform, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;          # 头像/文件上传
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'self'" always;
    add_header Cache-Control $html_cache_control always;

    # 反代到 Go 后端时统一带上的头(含 WebSocket 升级)
    proxy_http_version 1.1;
    # $http_host 保留非默认端口，供后端与浏览器 Origin 做完整同源比较。
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # WebSocket 通知(/api/v1/ws/notifications)
    location = /api/v1/ws/notifications {
        access_log /var/log/nginx/access.log ws_no_args;
        proxy_pass http://backend:6987;
        proxy_read_timeout 3600s;
    }

    # API 与后端托管的静态/上传资源
    location ^~ /api/v1/  { proxy_pass http://backend:6987; }
    location ^~ /static/  { proxy_pass http://backend:6987; }
    location ^~ /uploads/ { proxy_pass http://backend:6987; }
    location = /health    { proxy_pass http://backend:6987; }

    # SPA:history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
