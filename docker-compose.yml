# coinsphere-go V2 开发栈：Go App 内置 Web 产物并使用内部 PostgreSQL，schema 只由一次性 migration 建立。
# 一键启动：docker compose up -d --build，然后访问 http://localhost:8080
services:
  postgresql:
    image: postgres:16.3-alpine@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
    container_name: coinsphere-go-postgresql
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: coinsphere
      POSTGRES_USER: coinsphere
      POSTGRES_PASSWORD: coinsphere-dev-only
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username=coinsphere --dbname=coinsphere"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: coinsphere-go-backend
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      [
        "/app/coinsphere-migrate",
        "-config",
        "/app/config.yml",
        "-direction",
        "up",
      ]
    environment:
      COINSPHERE_DATABASE__DSN: postgresql://coinsphere:coinsphere-dev-only@postgresql:5432/coinsphere?sslmode=disable&options=-csearch_path%3Dpublic
    networks:
      - database

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: coinsphere-go-backend
    container_name: coinsphere-go-backend
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      COINSPHERE_DATABASE__DSN: postgresql://coinsphere:coinsphere-dev-only@postgresql:5432/coinsphere?sslmode=disable&options=-csearch_path%3Dpublic
      # 必填：未设置则 compose 直接报错。生成随机值：openssl rand -hex 32
      COINSPHERE_AUTH__SECRET_KEY: ${COINSPHERE_AUTH__SECRET_KEY:?请设置 COINSPHERE_AUTH__SECRET_KEY(.env 或环境变量,如 openssl rand -hex 32)}
      COINSPHERE_WORKFLOW__HTTP_ALLOWED_HOSTS: ${COINSPHERE_WORKFLOW__HTTP_ALLOWED_HOSTS:-[]}
      # COINSPHERE_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ${COINSPHERE_AUTH__BOOTSTRAP_ADMIN_PASSWORD:-}
      # COINSPHERE_AUTH__ENCRYPTION_KEY: ${COINSPHERE_AUTH__ENCRYPTION_KEY:-}
      # COINSPHERE_AUTH__WEBHOOK_PEPPER: ${COINSPHERE_AUTH__WEBHOOK_PEPPER:-}
    volumes:
      - backend-uploads:/app/volumes/uploads
      - backend-static:/app/volumes/static
      - backend-artifacts:/app/volumes/artifacts
    ports:
      - "${COINSPHERE_WEB_PORT:-8080}:6987"
    networks:
      - default
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:6987/health/ready >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-artifacts:
  backend-uploads:
  backend-static:
  postgresql-data:

networks:
  database:
    internal: true
