# CoinSphere Go backend configuration. PostgreSQL DSN must be injected by the environment.
database:
  dsn: ""
  max_open_conns: 40
  max_idle_conns: 10
  conn_max_idle_time_seconds: 300

server:
  host: 0.0.0.0
  port: 6987
  public_base_url: "http://127.0.0.1:6987"

auth:
  # Must be replaced in every non-local environment.
  secret_key: "coinsphere-dev-secret"
  access_token_ttl_minutes: 15
  password_iterations: 390000
  login_rate_limit_per_minute: 10

workflow:
  # Exact public domain names that Connector and AI nodes may access.
  http_allowed_hosts: []

log:
  level: info
  retention_days: 30
