name: coinsphere-go

services:
  timescaledb:
    image: timescale/timescaledb:2.29.0-pg17@sha256:3e65c273cbf7218f2a28692492b4625b49f35c7d2142e945561ef52311a8c83a
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: coinsphere
      POSTGRES_USER: coinsphere
      POSTGRES_PASSWORD: ${COINSPHERE_DATABASE_PASSWORD:?请设置 COINSPHERE_DATABASE_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=coinsphere --dbname=coinsphere"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${COINSPHERE_BACKEND_IMAGE:?请设置 COINSPHERE_BACKEND_IMAGE}
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - runtime.env
    environment:
      COINSPHERE_DATABASE__DSN: postgresql://coinsphere:${COINSPHERE_DATABASE_PASSWORD}@timescaledb:5432/coinsphere?sslmode=disable&options=-csearch_path%3Dpublic
    volumes:
      - backend-uploads:/app/volumes/uploads
      - backend-static:/app/volumes/static
    networks:
      - default
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6987/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: ${COINSPHERE_WORKER_IMAGE:?请设置 COINSPHERE_WORKER_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "coinsphere_worker", "run"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      TZ: UTC
      COINSPHERE_WORKER_DATABASE_DSN: postgresql://coinsphere:${COINSPHERE_DATABASE_PASSWORD}@timescaledb:5432/coinsphere?sslmode=disable&options=-csearch_path%3Dpublic
      COINSPHERE_WORKER_ARTIFACT_DIR: /app/artifacts
      COINSPHERE_WORKER_BACKTEST_WALL_SECONDS: "300"
      COINSPHERE_WORKER_BACKTEST_CPU_SECONDS: "300"
      COINSPHERE_WORKER_BACKTEST_MEMORY_BYTES: "536870912"
      COINSPHERE_WORKER_BACKTEST_ARTIFACT_BYTES: "134217728"
    volumes:
      - worker-artifacts:/app/artifacts
    networks:
      - database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  web:
    image: ${COINSPHERE_WEB_IMAGE:?请设置 COINSPHERE_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${COINSPHERE_WEB_BIND:-127.0.0.1}:${COINSPHERE_WEB_PORT:-8080}:80"

  executor:
    image: ${COINSPHERE_BACKEND_IMAGE:?请设置 COINSPHERE_BACKEND_IMAGE}
    profiles: ["private"]
    restart: unless-stopped
    command: ["/app/coinsphere-executor", "-config", "/app/config.yml"]
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - path: executor-runtime.env
        required: false
    environment:
      COINSPHERE_DATABASE__DSN: postgresql://coinsphere:${COINSPHERE_DATABASE_PASSWORD}@timescaledb:5432/coinsphere?sslmode=disable&options=-csearch_path%3Dpublic
    networks:
      - database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

volumes:
  backend-uploads:
    name: coinsphere-go-backend-uploads
  backend-static:
    name: coinsphere-go-backend-static
  timescale-data:
    name: coinsphere-go-timescale-data
  worker-artifacts:
    name: coinsphere-go-worker-artifacts

networks:
  database:
    internal: true
