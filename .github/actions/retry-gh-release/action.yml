name: Retry GitHub Release
description: Retry transient GitHub Release API failures with the same verified artifacts

inputs:
  version:
    description: Release tag
    required: true
  draft:
    description: Keep the release as a draft
    required: false
    default: "false"
  files:
    description: Release asset globs
    required: false
    default: ""
  fail_on_unmatched_files:
    description: Fail when an asset glob matches no files
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: GitHub Release attempt 1
      id: release_attempt_1
      continue-on-error: true
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        NODE_USE_ENV_PROXY: "1"
      with:
        tag_name: ${{ inputs.version }}
        name: CoinSphere ${{ inputs.version }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        draft: ${{ inputs.draft }}
        preserve_order: true
        overwrite_files: true
        fail_on_unmatched_files: ${{ inputs.fail_on_unmatched_files }}
        files: ${{ inputs.files }}

    - name: Wait before GitHub Release attempt 2
      if: steps.release_attempt_1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: GitHub Release attempt 2
      id: release_attempt_2
      if: steps.release_attempt_1.outcome == 'failure'
      continue-on-error: true
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        NODE_USE_ENV_PROXY: "1"
      with:
        tag_name: ${{ inputs.version }}
        name: CoinSphere ${{ inputs.version }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        draft: ${{ inputs.draft }}
        preserve_order: true
        overwrite_files: true
        fail_on_unmatched_files: ${{ inputs.fail_on_unmatched_files }}
        files: ${{ inputs.files }}

    - name: Wait before GitHub Release attempt 3
      if: steps.release_attempt_1.outcome == 'failure' && steps.release_attempt_2.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: GitHub Release attempt 3
      if: steps.release_attempt_1.outcome == 'failure' && steps.release_attempt_2.outcome == 'failure'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        NODE_USE_ENV_PROXY: "1"
      with:
        tag_name: ${{ inputs.version }}
        name: CoinSphere ${{ inputs.version }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        draft: ${{ inputs.draft }}
        preserve_order: true
        overwrite_files: true
        fail_on_unmatched_files: ${{ inputs.fail_on_unmatched_files }}
        files: ${{ inputs.files }}
