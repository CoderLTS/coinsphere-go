name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: PR base and change scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      release: ${{ steps.scope.outputs.release }}
      worker: ${{ steps.scope.outputs.worker }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Validate PR base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$IS_DRAFT" != "true" && "$BASE_REF" != "main" ]]; then
            echo "::error title=PR base invalid::Ready PR must target main; keep stacked PRs as drafts."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select affected modules
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          backend=false
          frontend=false
          release=false
          worker=false
          full=false

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            backend=true
            frontend=true
            release=true
            worker=true
            full=true
          else
            while IFS= read -r file; do
              case "$file" in
                backend/*) backend=true ;;
                frontend/*) frontend=true ;;
                scripts/release/*|deploy/production/*|.github/workflows/release.yml) release=true ;;
                worker/*) worker=true ;;
                .github/workflows/ci.yml)
                  backend=true
                  frontend=true
                  release=true
                  worker=true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "release=$release"
            echo "worker=$worker"
            echo "full=$full"
          } >>"$GITHUB_OUTPUT"

  backend:
    name: Go backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.29.0-pg17@sha256:3e65c273cbf7218f2a28692492b4625b49f35c7d2142e945561ef52311a8c83a
        env:
          POSTGRES_DB: coinsphere_test
          POSTGRES_PASSWORD: migration-ci-only
          POSTGRES_USER: coinsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=coinsphere --dbname=coinsphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COINSPHERE_TEST_POSTGRES_DSN: postgres://coinsphere:migration-ci-only@127.0.0.1:5432/coinsphere_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Tests
        if: needs.changes.outputs.full != 'true'
        run: go test -count=1 ./...
      - name: Test with race detector
        if: needs.changes.outputs.full == 'true'
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Vue frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Stylelint
        run: pnpm lint:stylelint
      - name: Unit tests
        run: pnpm test
      - name: Type check and build
        run: pnpm build

  browser-smoke:
    name: Playwright browser smoke
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: needs.changes.outputs.full != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Chromium smoke tests
        if: needs.changes.outputs.full != 'true'
        run: pnpm exec playwright test --project=chromium
      - name: Install all Playwright browsers
        if: needs.changes.outputs.full == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run all browser smoke tests
        if: needs.changes.outputs.full == 'true'
        run: pnpm test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  worker:
    name: Python worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.29.0-pg17@sha256:3e65c273cbf7218f2a28692492b4625b49f35c7d2142e945561ef52311a8c83a
        env:
          POSTGRES_DB: coinsphere_worker_test
          POSTGRES_PASSWORD: worker-ci-only
          POSTGRES_USER: coinsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=coinsphere --dbname=coinsphere_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COINSPHERE_TEST_POSTGRES_DSN: postgres://coinsphere:worker-ci-only@127.0.0.1:5432/coinsphere_worker_test?sslmode=disable
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy coinsphere_worker tests
      - name: Pytest
        run: uv run --frozen pytest

  release:
    name: Release script checks
    needs: changes
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release maintenance scripts
        run: |
          bash -n scripts/release/*.sh scripts/release/tests/*.sh deploy/production/*.sh
          shellcheck scripts/release/*.sh scripts/release/tests/*.sh deploy/production/*.sh
          for test_script in scripts/release/tests/*.sh; do
            bash "$test_script"
          done

  containers:
    name: Integration and containers
    needs:
      - changes
      - backend
      - browser-smoke
      - frontend
      - worker
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      COINSPHERE_AUTH__SECRET_KEY: ci-only-secret-key-that-is-never-deployed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate release maintenance scripts
        run: |
          bash -n scripts/release/*.sh scripts/release/tests/*.sh deploy/production/*.sh
          shellcheck scripts/release/*.sh scripts/release/tests/*.sh deploy/production/*.sh
          for test_script in scripts/release/tests/*.sh; do
            bash "$test_script"
          done
      - name: Build Compose images
        run: docker compose build
      - name: Verify image proxy isolation
        run: |
          proxy_pattern='^(HTTP_PROXY|HTTPS_PROXY|NO_PROXY|http_proxy|https_proxy|no_proxy)='
          for image in coinsphere-go-backend:latest coinsphere-go-web:latest coinsphere-go-worker:latest; do
            image_env=$(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}')
            if grep -Eq "$proxy_pattern" <<<"$image_env"; then
              echo "镜像包含运行时代理变量: $image" >&2
              exit 1
            fi
          done
      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: coinsphere-go-backend:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: coinsphere-go-web:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
      - name: Scan worker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: coinsphere-go-worker:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
      - name: Start Compose stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Verify runtime proxy isolation
        run: |
          proxy_pattern='^(HTTP_PROXY|HTTPS_PROXY|NO_PROXY|http_proxy|https_proxy|no_proxy)='
          for service in backend web worker; do
            container_id=$(docker compose ps --quiet "$service")
            [[ -n $container_id ]] || { echo "未找到运行容器: $service" >&2; exit 1; }
            container_env=$(docker inspect "$container_id" --format '{{range .Config.Env}}{{println .}}{{end}}')
            if grep -Eq "$proxy_pattern" <<<"$container_env"; then
              echo "运行容器包含代理变量: $service" >&2
              exit 1
            fi
          done
      - name: Verify Worker A1 health contract
        run: |
          docker compose exec -T worker python -m coinsphere_worker health |
            python3 -c 'import json, sys; assert json.load(sys.stdin) == {"mode": "a1-postgres", "protocolVersion": 1, "role": "quant-worker", "status": "healthy", "taskConsumer": True}'
      - name: Smoke test health endpoint
        run: curl --fail --show-error --retry 10 --retry-all-errors --retry-delay 3 http://127.0.0.1:8080/health
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  pr-gate:
    name: PR summary gate
    needs:
      - changes
      - backend
      - browser-smoke
      - frontend
      - release
      - worker
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ needs.changes.result }}" == "success" ]] || exit 1

          require_selected() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "::error title=PR gate failed::$3 check finished with $2"; return 1 ;;
            esac
          }

          require_selected "${{ needs.changes.outputs.backend }}" "${{ needs.backend.result }}" backend
          require_selected "${{ needs.changes.outputs.frontend }}" "${{ needs.frontend.result }}" frontend
          require_selected "${{ needs.changes.outputs.frontend }}" "${{ needs.browser-smoke.result }}" browser-smoke
          require_selected "${{ needs.changes.outputs.release }}" "${{ needs.release.result }}" release
          require_selected "${{ needs.changes.outputs.worker }}" "${{ needs.worker.result }}" worker
