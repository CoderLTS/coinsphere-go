name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  migration:
    name: PostgreSQL 16 migration and transfer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coinsphere
          POSTGRES_PASSWORD: coinsphere
          POSTGRES_DB: coinsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coinsphere -d coinsphere"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply Core4 baseline
        env:
          COINSPHERE_AUTH__SECRET_KEY: ci-only-secret
          COINSPHERE_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ci-only-password
        run: |
          cat > /tmp/coinsphere-ci.yml <<'EOF'
          database:
            dsn: postgres://coinsphere:coinsphere@127.0.0.1:5432/coinsphere?sslmode=disable
          auth:
            secret_key: ci-only-secret
            bootstrap_admin_password: ci-only-password
          EOF
          go run ./cmd/migrate --config /tmp/coinsphere-ci.yml
      - name: Verify export and atomic import interface
        env:
          COINSPHERE_AUTH__SECRET_KEY: ci-only-secret
          COINSPHERE_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ci-only-password
        run: |
          cat > /tmp/coinsphere-transfer.json <<'EOF'
          {"schemaVersion":1,"exportedAt":"2026-01-01T00:00:00Z","groups":[],"workflows":[]}
          EOF
          go run ./cmd/coinsphere workflow import-v3 --config /tmp/coinsphere-ci.yml --in /tmp/coinsphere-transfer.json --report /tmp/coinsphere-report.json
          go run ./cmd/coinsphere workflow export-legacy --config /tmp/coinsphere-ci.yml --out /tmp/coinsphere-export.json
          test -s /tmp/coinsphere-report.json
          test -s /tmp/coinsphere-export.json

  frontend:
    name: Vue frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Stylelint
        run: pnpm lint:stylelint
      - name: Type check and build
        run: pnpm build
