name: Reset production database

on:
  workflow_dispatch:
    inputs:
      version:
        description: "重置后要部署的版本，例如 v0.2.5-deploy.1"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  reset-and-deploy:
    name: Reset CoinSphere TimescaleDB and redeploy
    runs-on: [self-hosted, Linux, X64, coinsphere-release, production]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Reset CoinSphere TimescaleDB volume
        id: reset
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "版本号格式无效" >&2
            exit 2
          }

          volume=coinsphere-go-timescale-data
          container=$(docker ps -aq --filter label=com.docker.compose.project=coinsphere-go | sed -n '1p')
          deploy_dir=''
          if [[ -n "$container" ]]; then
            deploy_dir=$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$container")
          else
            mapfile -t deploy_dirs < <(find /home /opt /srv /var/lib /root -maxdepth 8 -type f \
              -path '*/coinsphere-go/compose.yaml' -printf '%h\n' 2>/dev/null \
              | while IFS= read -r dir; do
                  [[ -f "$dir/.env" && -f "$dir/runtime.env" ]] && printf '%s\n' "$dir"
                done | sort -u)
            ((${#deploy_dirs[@]} == 1)) || {
              echo "无法唯一定位 CoinSphere 部署目录" >&2
              exit 1
            }
            deploy_dir=${deploy_dirs[0]}
          fi
          [[ -f "$deploy_dir/compose.yaml" && -f "$deploy_dir/.env" ]] || {
            echo "CoinSphere 部署目录不完整" >&2
            exit 1
          }

          if docker ps -q \
            --filter label=com.docker.compose.project=coinsphere-go \
            --filter label=com.docker.compose.service=executor | grep -q .; then
            echo "Private Executor 正在运行，拒绝删除数据库卷" >&2
            exit 1
          fi

          if docker volume inspect "$volume" >/dev/null 2>&1; then
            volume_project=$(docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$volume")
            volume_key=$(docker volume inspect --format '{{ index .Labels "com.docker.compose.volume" }}' "$volume")
            [[ "$volume_project" == coinsphere-go && "$volume_key" == timescale-data ]] || {
              echo "目标卷不是 CoinSphere 独立 TimescaleDB 卷" >&2
              exit 1
            }
            compose=(docker compose --project-name coinsphere-go --project-directory "$deploy_dir" \
              --env-file "$deploy_dir/.env" -f "$deploy_dir/compose.yaml")
            "${compose[@]}" stop timescaledb backend worker web
            "${compose[@]}" rm -f timescaledb backend worker web
            if docker ps -q --filter volume="$volume" | grep -q .; then
              echo "数据库卷仍被容器使用，拒绝删除" >&2
              exit 1
            fi
            docker volume rm "$volume"
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "数据库卷删除校验失败" >&2
              exit 1
            fi
          fi
          printf 'deploy_dir=%s\n' "$deploy_dir" >>"$GITHUB_OUTPUT"
          echo "已确认 $volume 不存在；开始触发 $VERSION 部署"

      - name: Trigger deployment from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEPLOY_DIR: ${{ steps.reset.outputs.deploy_dir }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 3 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer '"$GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d "$(jq -cn --arg version "$VERSION" --arg deploy_dir "$DEPLOY_DIR" \
              '{ref:"main",inputs:{version:$version,deploy_dir:$deploy_dir}}')"
