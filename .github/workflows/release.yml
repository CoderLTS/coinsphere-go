name: Release and deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "部署版本号，例如 v0.3.1-deploy.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coinsphere-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy
    runs-on: [self-hosted, Linux, X64, coinsphere-release, production]
    environment: production
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      COINSPHERE_REGISTRY: 127.0.0.1:5000
      COINSPHERE_BUILDER: coinsphere-release-v2
      COINSPHERE_BUILD_OUTPUT: registry
      COINSPHERE_BUILDER_MEMORY: 1536m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate release source and version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "只能从 main 手工部署" >&2; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "版本号必须符合 vX.Y.Z 格式" >&2; exit 1; }
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer $GITHUB_TOKEN"
          for attempt in 1 2 3; do
            git fetch --quiet origin main --tags && break
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "当前 Commit 不是最新 main" >&2; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "版本标签已存在: $VERSION" >&2
            exit 1
          fi

      - name: Build and push application image
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/release/build.sh "$VERSION" "$GITHUB_SHA" dist images-only
          backend_digest=$(jq -er '.backendDigest' dist/release-manifest.json)
          [[ $backend_digest =~ ^127\.0\.0\.1:5000/coinsphere/backend@sha256:[0-9a-f]{64}$ ]] || exit 1

      - name: Deploy independent CoinSphere Compose
        shell: bash
        run: bash deploy/production/deploy.sh "$VERSION" dist/release-manifest.json

      - name: Apply CoinSphere Registry retention
        continue-on-error: true
        shell: bash
        env:
          COINSPHERE_REGISTRY_KEEP_RELEASES: "10"
        run: bash scripts/release/prune-registry.sh --apply

      - name: Clean persistent release Runner
        if: always()
        continue-on-error: true
        shell: bash
        env:
          COINSPHERE_BUILD_CACHE_MAX_SIZE: 2gb
          COINSPHERE_RUNNER_TEMP_MAX_AGE_MINUTES: "1440"
        run: bash scripts/release/cleanup-runner.sh
