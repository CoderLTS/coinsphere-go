name: Release and deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: coinsphere-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and deploy
    runs-on: [self-hosted, Linux, X64, coinsphere-release, production]
    environment: production
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      COINSPHERE_REGISTRY: 127.0.0.1:5000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Validate release source and version
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "只能从 main 手工发布" >&2; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "版本号必须符合 vX.Y.Z 格式" >&2; exit 1; }
          git fetch --quiet origin main --tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "当前 Commit 不是最新 main" >&2; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "版本标签已存在: $VERSION" >&2
            exit 1
          fi

      - name: Build packages and push images
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/release/build.sh "$VERSION" "$GITHUB_SHA" dist
          backend_digest=$(jq -er '.backendDigest' dist/release-manifest.json)
          web_digest=$(jq -er '.webDigest' dist/release-manifest.json)
          worker_digest=$(jq -er '.workerDigest' dist/release-manifest.json)
          [[ $backend_digest =~ ^127\.0\.0\.1:5000/coinsphere/backend@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ $web_digest =~ ^127\.0\.0\.1:5000/coinsphere/web@sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ $worker_digest =~ ^127\.0\.0\.1:5000/coinsphere/worker@sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'backend_digest=%s\n' "$backend_digest" >>"$GITHUB_OUTPUT"
          printf 'web_digest=%s\n' "$web_digest" >>"$GITHUB_OUTPUT"
          printf 'worker_digest=%s\n' "$worker_digest" >>"$GITHUB_OUTPUT"

      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: registry:${{ steps.build.outputs.backend_digest }}
          format: spdx-json
          output-file: dist/coinsphere-${{ inputs.version }}-backend.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: registry:${{ steps.build.outputs.web_digest }}
          format: spdx-json
          output-file: dist/coinsphere-${{ inputs.version }}-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate worker SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: registry:${{ steps.build.outputs.worker_digest }}
          format: spdx-json
          output-file: dist/coinsphere-${{ inputs.version }}-worker.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan release images
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ steps.build.outputs.backend_digest }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan web release image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ steps.build.outputs.web_digest }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan worker release image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ steps.build.outputs.worker_digest }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Generate final checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            "./coinsphere-$VERSION-windows-x86.zip" \
            "./coinsphere-$VERSION-linux-amd64.tar.gz" \
            "./coinsphere-$VERSION-docker.tar.gz" \
            ./release-manifest.json \
            "./coinsphere-$VERSION-backend.spdx.json" \
            "./coinsphere-$VERSION-web.spdx.json" \
            "./coinsphere-$VERSION-worker.spdx.json" >SHA256SUMS

      - name: Scan final release artifacts
        shell: bash
        run: |
          command -v python3 >/dev/null || { echo "缺少命令: python3" >&2; exit 3; }
          python3 scripts/release/scan-artifacts.py "$VERSION" "$GITHUB_SHA" dist

      - name: Preserve release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coinsphere-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy through shared DPanel Stack
        shell: bash
        run: bash scripts/release/deploy-dpanel-stack.sh "$VERSION" dist/release-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          name: CoinSphere ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*

      - name: Apply CoinSphere Registry retention
        continue-on-error: true
        shell: bash
        env:
          COINSPHERE_REGISTRY_KEEP_RELEASES: "10"
        run: bash scripts/release/prune-registry.sh --apply

      - name: Clean persistent release Runner
        if: always()
        continue-on-error: true
        shell: bash
        env:
          COINSPHERE_BUILD_CACHE_MAX_AGE: 168h
          COINSPHERE_RUNNER_TEMP_MAX_AGE_MINUTES: "1440"
        run: bash scripts/release/cleanup-runner.sh
