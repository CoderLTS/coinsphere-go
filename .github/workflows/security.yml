name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-changes:
    name: Dependency change scope
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.scope.outputs.go }}
      filesystem: ${{ steps.scope.outputs.filesystem }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Select dependency scans
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          go=false
          filesystem=false

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            go=true
            filesystem=true
          else
            while IFS= read -r file; do
              case "$file" in
                backend/go.mod|backend/go.sum|plugins/*/backend/go.mod|plugins/*/backend/go.sum)
                  go=true
                  filesystem=true
                  ;;
                frontend/package.json|frontend/pnpm-lock.yaml|docker-compose.yml|*/Dockerfile|*/Dockerfile.*|.github/workflows/*.yml)
                  filesystem=true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "go=$go"
            echo "filesystem=$filesystem"
          } >>"$GITHUB_OUTPUT"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-dependencies:
    name: Go vulnerability scan
    needs: dependency-changes
    if: needs.dependency-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            plugins/contract-test/backend/go.sum
      - name: Govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          (cd ../plugins/contract-test/backend && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)

  filesystem:
    name: Dependency and filesystem scan
    needs: dependency-changes
    if: needs.dependency-changes.outputs.filesystem == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"
