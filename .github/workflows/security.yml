name: Security

on:
  pull_request:
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-dependencies:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  python-dependencies:
    name: Python dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Export runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/worker-requirements.txt
      - name: Pip audit
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement /tmp/worker-requirements.txt

  filesystem:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"
