name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "部署版本号，例如 v0.2.0-deploy.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      deploy_only: true
