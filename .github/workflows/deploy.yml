name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "部署版本号，例如 v0.2.0-deploy.1"
        required: true
        type: string
      deploy_dir:
        description: "可选的 CoinSphere 独立 Compose 目录"
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      deploy_only: true
      deploy_dir: ${{ inputs.deploy_dir }}
