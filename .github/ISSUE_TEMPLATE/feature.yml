name: 功能交付
description: 定义一个可独立验收和回滚的纵向能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 描述用户可观察到的结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 说明本次包含什么，以及明确不做什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可执行命令、预期结果和必要的人工验收条件。
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 风险与回滚
      description: 说明数据、安全、交易或部署风险，以及可执行的回滚方法。
    validations:
      required: true
